<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <radialGradient id="bgG" cx="45%" cy="38%" r="72%">
    <stop offset="0%"   stop-color="#3c1c78"/>
    <stop offset="58%"  stop-color="#1a0848"/>
    <stop offset="100%" stop-color="#080214"/>
  </radialGradient>
  <linearGradient id="coinG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#ffe880"/>
    <stop offset="50%"  stop-color="#ffcc33"/>
    <stop offset="100%" stop-color="#c88010"/>
  </linearGradient>
  <linearGradient id="blockG" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#f5b82a"/>
    <stop offset="100%" stop-color="#b07010"/>
  </linearGradient>
  <linearGradient id="goldBorderG" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#ffe880"/>
    <stop offset="50%"  stop-color="#ffcc33"/>
    <stop offset="100%" stop-color="#b0800a"/>
  </linearGradient>
  <radialGradient id="vigG" cx="50%" cy="50%" r="72%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.38)"/>
  </radialGradient>
  <filter id="tGlow" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="4.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="rr">
    <rect width="512" height="512" rx="92" ry="92"/>
  </clipPath>
</defs>

<g clip-path="url(#rr)">

  <!-- ── BACKGROUND ── -->
  <rect width="512" height="512" fill="url(#bgG)"/>

  <!-- Ambient glow around character -->
  <ellipse cx="212" cy="340" rx="130" ry="140" fill="rgba(80,28,190,0.26)"/>

  <!-- ── STARS ── -->
  <g fill="white">
    <circle cx="46"  cy="36"  r="2.0" opacity="0.90"/>
    <circle cx="105" cy="18"  r="1.5" opacity="0.70"/>
    <circle cx="186" cy="50"  r="1.8" opacity="0.85"/>
    <circle cx="290" cy="14"  r="1.4" opacity="0.70"/>
    <circle cx="366" cy="40"  r="2.2" opacity="0.90"/>
    <circle cx="440" cy="24"  r="1.5" opacity="0.70"/>
    <circle cx="475" cy="66"  r="1.8" opacity="0.80"/>
    <circle cx="62"  cy="90"  r="1.4" opacity="0.60"/>
    <circle cx="342" cy="72"  r="1.8" opacity="0.80"/>
    <circle cx="152" cy="88"  r="1.4" opacity="0.65"/>
    <circle cx="416" cy="92"  r="1.0" opacity="0.70"/>
    <circle cx="20"  cy="128" r="1.5" opacity="0.65"/>
    <circle cx="244" cy="26"  r="1.0" opacity="0.80"/>
    <circle cx="498" cy="110" r="1.4" opacity="0.60"/>
  </g>

  <!-- ── ? BLOCK (upper right, floating) ── -->
  <g transform="translate(328,170)">
    <rect x="4" y="4" width="82" height="82" rx="9" fill="rgba(0,0,0,0.32)"/>
    <rect width="82" height="82" rx="9" fill="url(#blockG)"/>
    <rect width="82"  height="10" rx="5" fill="rgba(255,255,255,0.28)"/>
    <rect width="10"  height="82" rx="5" fill="rgba(255,255,255,0.14)"/>
    <rect y="72"  width="82" height="10" rx="5" fill="rgba(0,0,0,0.22)"/>
    <rect x="72"  width="10" height="82" rx="5" fill="rgba(0,0,0,0.12)"/>
    <rect width="82" height="82" rx="9" fill="none" stroke="#7a4800" stroke-width="3.5"/>
    <text x="41" y="59"
          font-family="'Arial Black','Impact',sans-serif"
          font-weight="900" font-size="50" fill="#3a2000" text-anchor="middle">?</text>
    <text x="40" y="58"
          font-family="'Arial Black','Impact',sans-serif"
          font-weight="900" font-size="50" fill="rgba(255,240,150,0.35)" text-anchor="middle">?</text>
  </g>

  <!-- ── COIN above block ── -->
  <ellipse cx="372" cy="148" rx="26" ry="26" fill="rgba(255,204,40,0.28)"/>
  <ellipse cx="372" cy="148" rx="18" ry="24" fill="url(#coinG)"/>
  <ellipse cx="372" cy="148" rx="12" ry="16" fill="none" stroke="rgba(0,0,0,0.20)" stroke-width="2.5"/>
  <ellipse cx="367" cy="140" rx="6"  ry="8.5" fill="rgba(255,255,255,0.55)"/>
  <!-- Sparkle -->
  <g fill="#ffe880" opacity="0.90" transform="translate(390,127) scale(1.7)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2"/>
  </g>

  <!-- Small coin to right -->
  <ellipse cx="434" cy="212" rx="12" ry="16" fill="url(#coinG)"/>
  <ellipse cx="430" cy="206" rx="4.5" ry="6.5" fill="rgba(255,255,255,0.52)"/>

  <!-- ── PLAYER CHARACTER (4× game scale) ── -->
  <!-- Hat top: y=242, feet bottom: y=454, width=88, center-x≈205 -->

  <!-- Arms (behind body) -->
  <rect x="130" y="330" width="34" height="32" rx="10" fill="#f4c89a"/>
  <rect x="246" y="318" width="34" height="32" rx="10" fill="#f4c89a"/>

  <!-- Hat body -->
  <rect x="161" y="242" width="88" height="58" rx="7" fill="#e63b2e"/>
  <rect x="161" y="242" width="88" height="7"  rx="4" fill="rgba(255,255,255,0.22)"/>
  <rect x="161" y="292" width="88" height="8"        fill="#a82018"/>
  <!-- Hat brim -->
  <rect x="146" y="292" width="118" height="14" rx="6" fill="#c22018"/>
  <rect x="146" y="292" width="118" height="4"  rx="3" fill="rgba(255,255,255,0.13)"/>

  <!-- Face -->
  <rect x="163" y="280" width="86" height="50" rx="7" fill="#f4c89a"/>
  <rect x="163" y="280" width="86" height="5"        fill="rgba(255,230,190,0.48)"/>
  <!-- Ears -->
  <rect x="148" y="288" width="17" height="26" rx="8" fill="#f0be90"/>
  <rect x="247" y="288" width="17" height="26" rx="8" fill="#f0be90"/>

  <!-- Eyebrow -->
  <rect x="210" y="284" width="34" height="7" rx="3" fill="#6a3a0a"/>
  <!-- Eye -->
  <rect x="218" y="284" width="14" height="20" rx="3" fill="#222"/>
  <rect x="221" y="286" width="6"  height="7"  rx="1" fill="rgba(255,255,255,0.80)"/>

  <!-- Nose -->
  <rect x="185" y="308" width="26" height="14" rx="7" fill="#e8a870"/>
  <!-- Mustache -->
  <rect x="164" y="318" width="66" height="11" rx="5" fill="#6a3a0a"/>

  <!-- Body (blue overalls) -->
  <rect x="164" y="322" width="82" height="84" rx="7" fill="#2b6cff"/>
  <rect x="164" y="322" width="82" height="9"        fill="rgba(255,255,255,0.13)"/>
  <rect x="164" y="322" width="9"  height="84"       fill="rgba(0,0,0,0.10)"/>
  <rect x="237" y="322" width="9"  height="84"       fill="rgba(0,0,0,0.12)"/>

  <!-- Suspender straps -->
  <rect x="182" y="322" width="24" height="56" rx="5" fill="#e63b2e"/>
  <rect x="204" y="322" width="24" height="56" rx="5" fill="#e63b2e"/> <!-- note: gap may not exist in small icon, intentional overlap -->
  <!-- Actually fix: left strap x=182, right strap x=218 with 12px gap -->
  <!-- Overwrite to correct positions -->
  <rect x="182" y="322" width="24" height="56" rx="5" fill="#e63b2e"/>
  <rect x="218" y="322" width="24" height="56" rx="5" fill="#e63b2e"/>
  <rect x="182" y="322" width="24" height="5"        fill="rgba(255,255,255,0.20)"/>
  <rect x="218" y="322" width="24" height="5"        fill="rgba(255,255,255,0.20)"/>
  <!-- Gold buttons -->
  <rect x="185" y="332" width="18" height="14" rx="4" fill="#ffcc33"/>
  <rect x="221" y="332" width="18" height="14" rx="4" fill="#ffcc33"/>
  <rect x="187" y="340" width="14" height="4"  rx="2" fill="rgba(0,0,0,0.22)"/>
  <rect x="223" y="340" width="14" height="4"  rx="2" fill="rgba(0,0,0,0.22)"/>

  <!-- Center overall button -->
  <circle cx="205" cy="388" r="7" fill="rgba(255,255,255,0.22)"/>

  <!-- Legs -->
  <rect x="169" y="402" width="34" height="52" rx="6" fill="#3a2b1a"/>
  <rect x="211" y="402" width="34" height="52" rx="6" fill="#3a2b1a"/>

  <!-- Shoes -->
  <rect x="156" y="434" width="54" height="22" rx="8" fill="#2a1a08"/>
  <rect x="204" y="434" width="54" height="22" rx="8" fill="#2a1a08"/>
  <rect x="156" y="434" width="54" height="5"  rx="4" fill="rgba(255,255,255,0.10)"/>
  <rect x="204" y="434" width="54" height="5"  rx="4" fill="rgba(255,255,255,0.10)"/>

  <!-- ── GROUND ── -->
  <!-- Grass blades near character feet -->
  <rect x="156" y="448" width="5"  height="10" rx="2" fill="#52c860"/>
  <rect x="166" y="446" width="4"  height="12" rx="2" fill="#52c860"/>
  <rect x="254" y="448" width="5"  height="10" rx="2" fill="#52c860"/>
  <rect x="263" y="446" width="4"  height="12" rx="2" fill="#52c860"/>
  <!-- Grass strip -->
  <rect x="0"   y="454" width="512" height="18" fill="#3daa4a"/>
  <rect x="0"   y="454" width="512" height="6"  fill="#52c860"/>
  <rect x="0"   y="466" width="512" height="4"  fill="#267830"/>
  <!-- Dirt blocks -->
  <rect x="0"   y="468" width="512" height="44" fill="#7a4e2a"/>
  <rect x="0"   y="468" width="512" height="4"  fill="rgba(255,255,255,0.07)"/>
  <g stroke="#5a3a1a" stroke-width="2">
    <line x1="0"   y1="482" x2="512" y2="482"/>
    <line x1="0"   y1="496" x2="512" y2="496"/>
    <line x1="64"  y1="468" x2="64"  y2="512"/>
    <line x1="128" y1="468" x2="128" y2="512"/>
    <line x1="192" y1="468" x2="192" y2="512"/>
    <line x1="256" y1="468" x2="256" y2="512"/>
    <line x1="320" y1="468" x2="320" y2="512"/>
    <line x1="384" y1="468" x2="384" y2="512"/>
    <line x1="448" y1="468" x2="448" y2="512"/>
  </g>

  <!-- ── TITLE TEXT ── -->
  <!-- Shadow / glow -->
  <text x="258" y="90"
    font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"
    font-weight="900" font-size="44" fill="rgba(255,200,40,0.30)"
    text-anchor="middle">超級冒險大陸</text>
  <!-- Main title -->
  <text x="256" y="88"
    font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif"
    font-weight="900" font-size="44" fill="#ffe55a"
    text-anchor="middle" filter="url(#tGlow)">超級冒險大陸</text>
  <!-- Star accents -->
  <text x="62"  y="88" font-size="18" fill="#ffcc33" text-anchor="middle">★</text>
  <text x="450" y="88" font-size="18" fill="#ffcc33" text-anchor="middle">★</text>
  <!-- Subtitle -->
  <text x="256" y="126"
    font-family="'Courier New',monospace"
    font-weight="700" font-size="18" fill="#9d6bff"
    text-anchor="middle" letter-spacing="5">SUPER ADVENTURE 3</text>
  <!-- Separator line -->
  <rect x="90" y="136" width="332" height="2" rx="1" fill="rgba(157,107,255,0.35)"/>

  <!-- ── VIGNETTE ── -->
  <rect width="512" height="512" fill="url(#vigG)"/>

  <!-- ── GOLD BORDER ── -->
  <rect x="8" y="8" width="496" height="496" rx="88"
    fill="none" stroke="url(#goldBorderG)" stroke-width="6" opacity="0.72"/>

</g>
</svg>
